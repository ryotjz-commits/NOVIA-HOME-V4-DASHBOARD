<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <title>Modern smart home at dusk</title>
  <desc>Modern minimalist home with warm illuminated windows, landscaped garden and a calm blue evening sky.</desc>
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#142C3D"/><stop offset=".52" stop-color="#345568"/><stop offset="1" stop-color="#B18B68"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9CC3C9" stop-opacity=".82"/><stop offset="1" stop-color="#243E4C" stop-opacity=".95"/></linearGradient>
    <linearGradient id="wall" x1="580" y1="280" x2="1080" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#F0E8D9"/><stop offset="1" stop-color="#B9B1A3"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9C7555"/><stop offset="1" stop-color="#4D4036"/></linearGradient>
    <linearGradient id="lawn" x1="800" y1="600" x2="800" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#405B50"/><stop offset="1" stop-color="#172F2B"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#F5D7A0" stop-opacity=".52"/><stop offset="1" stop-color="#F5D7A0" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="350" y="210" width="900" height="650" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
