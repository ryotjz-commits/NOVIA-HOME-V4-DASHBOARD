  <path d="M236 398 L236 338 L276 398 L276 338" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Windows -->
  <rect x="162" y="318" width="36" height="36" rx="10" fill="#93C5FD"/>
  <rect x="314" y="318" width="36" height="36" rx="10" fill="#93C5FD"/>

