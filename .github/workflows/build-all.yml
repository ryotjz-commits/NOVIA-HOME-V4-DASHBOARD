name: NOVIA HOME - Build APK + ESP32 BIN

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'firmware/**'
      - '.github/workflows/build-all.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android Gradle project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          grep -q "id 'com.android.application' version '8.7.3'" build.gradle
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-firmware:
    name: Build ESP32 DevKit V1 Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install Blynk
      - name: Inject private Blynk token (GitHub Secret)
        env:
          BLYNK_AUTH_TOKEN: ${{ secrets.BLYNK_AUTH_TOKEN }}
        run: |
          if [ -n "$BLYNK_AUTH_TOKEN" ]; then
            printf '#pragma once\n#define BLYNK_AUTH_TOKEN "%s"\n' "$BLYNK_AUTH_TOKEN" > firmware/NOVIA_HOME_V4_4/secrets.h
          else
            echo '::warning::GitHub Secret BLYNK_AUTH_TOKEN is empty. Firmware will compile without Blynk authentication.'
            printf '#pragma once\n#define BLYNK_AUTH_TOKEN ""\n' > firmware/NOVIA_HOME_V4_4/secrets.h
          fi
      - name: Build ESP32 firmware
        run: |
          arduino-cli compile --verbose --fqbn esp32:esp32:esp32 \
            --libraries "$HOME/Arduino/libraries" \
            --output-dir "$GITHUB_WORKSPACE/out-firmware" \
            firmware/NOVIA_HOME_V4_4
      - name: Prepare firmware release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/flash-files

          # The application image is the sketch-specific .ino.bin file.
          mapfile -t app_bins < <(find out-firmware -maxdepth 1 -type f -name '*.ino.bin' -print)
          if [ "${#app_bins[@]}" -ne 1 ]; then
            echo "Expected exactly one sketch application .ino.bin, found ${#app_bins[@]}"
            find out-firmware -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          cp "${app_bins[0]}" release/NOVIA-HOME-ESP32.bin

          # Keep all ESP32 flashing components together for USB/manual flashing.
          find out-firmware -maxdepth 1 -type f -name '*.bin' -exec cp {} release/flash-files/ +
          find out-firmware -maxdepth 1 -type f \( -name '*.elf' -o -name '*.map' \) -exec cp {} release/flash-files/ + || true

          cat > release/README-FIRMWARE.txt <<'EOF'
          NOVIA HOME V4.4 - ESP32 firmware output

          NOVIA-HOME-ESP32.bin is the sketch application image (.ino.bin).
          The flash-files folder contains the additional binaries generated by
          the ESP32 Arduino core (such as bootloader and partition table), when
          produced by the selected board/core configuration.

          For OTA/application-only updates, use the application image only when
          the update method expects an application .bin. For first-time USB
          flashing, use the complete set of generated flash files and the
          offsets reported by the matching Arduino/ESP32 board build process.
          Do not flash the application image at address 0x0.
          EOF

          (cd release && zip -qr NOVIA-HOME-ESP32-FLASH-PACKAGE.zip flash-files README-FIRMWARE.txt)
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-ESP32-FIRMWARE-BIN
          path: |
            release/NOVIA-HOME-ESP32.bin
            release/NOVIA-HOME-ESP32-FLASH-PACKAGE.zip
            release/README-FIRMWARE.txt
          if-no-files-found: error
          retention-days: 30
          
