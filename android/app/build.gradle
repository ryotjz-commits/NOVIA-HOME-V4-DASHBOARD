plugins {
    id 'com.android.application'
}

android {
    namespace 'id.novia.home'
    compileSdk 35

    defaultConfig {
        applicationId 'id.novia.home'
        minSdk 23
        targetSdk 35
        versionCode 44
        versionName '4.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
